<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Asesores UNA - Login</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="login-container">
        <!-- Sección del Logo UNA -->
        <div class="logo-container">
            <img src="logoUna.jpg" alt="Logo Universidad Nacional Abierta" class="logo-una">
        </div>

        <div class="login-header">
            <h2>Gestión de Asesores UNA</h2>
            <p>Ingrese sus credenciales de acceso</p>
        </div>

        <!-- Alerta dinámica de error / éxito -->
        <div id="alert-box" class="alert hidden"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Usuario o Correo Institucional</label>
                <input type="text" id="username" name="username" placeholder="Ej: asesor.una" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="form-actions">
                <button type="submit" id="btn-submit">Iniciar Sesión</button>
            </div>
        </form>

        <div class="login-footer">
            <a href="#" id="forgot-password">¿Olvidó su contraseña?</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
