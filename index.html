<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Asesores - UNA</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- PANTALLA PRINCIPAL / LOGIN -->
    <section id="login-section" class="card-container">
        <!-- Logo Centrado -->
        <div class="logo-container">
            <img src="logouna25.png" alt="Logo Universidad Nacional Abierta">
        </div>

        <h2>Inicio de Sesión</h2>

        <form id="login-form">
            <div class="input-group">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ej: msarabia" required autocomplete="username">
            </div>

            <div class="input-group">
                <label for="clave">Contraseña:</label>
                <input type="password" id="clave" name="clave" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-primary">Iniciar Sesión</button>
        </form>

        <p id="error-message" class="error-msg"></p>
    </section>

    <!-- PANTALLA SECUNDARIA / DASHBOARD CON BARRA DE HERRAMIENTAS -->
    <section id="dashboard-section" class="dashboard-container hidden">
        <!-- Barra de Herramientas Superior (Navbar) -->
        <nav class="navbar">
            <div class="navbar-brand">
                <img src="logouna25.png" alt="Logo UNA" class="navbar-logo">
                <span>Gestión de Asesores</span>
            </div>

            <ul class="navbar-menu">
                <li><a href="#" class="active">Inicio</a></li>
                <li><a href="#">Asesores</a></li>
                <li><a href="#">Asesorias</a></li>
                <li><a href="#">Estudiantes</a></li>
                <li><a href="#">Reportes</a></li>
            </ul>

            <div class="navbar-user">
                <span id="user-welcome">Bienvenido(a)</span>
                <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
            </div>
        </nav>

        <!-- Contenido Principal del Dashboard -->
        <main class="dashboard-content">
            <header class="content-header">
                <h2>Panel Principal</h2>
                <p>Seleccione una opción de la barra de herramientas para comenzar.</p>
            </header>

            <div class="dashboard-cards">
                <!-- Tarjetas informativas de ejemplo -->
                <div class="info-card">
                    <h3>Asesores Registrados</h3>
                    <p class="card-number">--</p>
                </div>
                <div class="info-card">
                    <h3>Atenciones Realizadas</h3>
                    <p class="card-number">--</p>
                </div>
            </div>
        </main>
    </section>

    <script src="script.js"></script>
</body>

</html>
